<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi Phương 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        background: radial-gradient(circle at 50% 30%, #420f36, #220b1f 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 80%, rgba(0, 0, 0, 0.25), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
        pointer-events: none;
        mix-blend-mode: screen;
        animation: glowMove 12s ease-in-out infinite;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: radial-gradient(circle, #ff2d8a 0%, #8a3dff 60%, transparent 80%);
        left: -15vmax;
        top: -10vmax;
        animation-delay: 0s;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: radial-gradient(circle, #8a3dff 0%, #ff2d8a 60%, transparent 80%);
        right: -12vmax;
        bottom: -10vmax;
        animation-delay: -6s;
      }
      @keyframes glowMove {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(2vw, 2vh) scale(1.08);
        }
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      .star.tiny {
        width: 1px;
        height: 1px;
        opacity: 0.6;
      }
      .star.med {
        width: 2px;
        height: 2px;
      }
      .star.faint {
        animation-duration: 4.5s;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.9rem, 8.5vw, 4rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.6rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 14px var(--rose), 0 0 40px rgba(255, 61, 132, 0.4);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.3, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose), 0 0 40px rgba(255, 61, 132, 0.45);
        will-change: transform;
        transition: opacity 0.8s ease-out;
        filter: drop-shadow(0 0 12px rgba(255, 61, 132, 0.45));
      }
      #hint {
        font-family: var(--script);
        font-size: clamp(1.2rem, 4.5vw, 1.8rem);
        color: var(--gold);
        animation: pulse 1.8s ease-in-out infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
        text-shadow: 0 0 30px rgba(255, 217, 168, 0.45);
        letter-spacing: 0.02em;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn,
      .b2 {
        padding: 0.95rem 2.4rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.08rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: radial-gradient(circle at 50% 30%, #ff9ec8, #ff3d84 70%);
        box-shadow: 0 0 30px rgba(255, 61, 132, 0.45), 0 10px 40px rgba(255, 61, 132, 0.25);
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        z-index: 5;
        position: relative;
        overflow: hidden;
      }
      #btn:hover,
      .b2:hover {
        transform: scale(1.08);
        box-shadow: 0 0 40px rgba(255, 61, 132, 0.6), 0 15px 50px rgba(255, 61, 132, 0.35);
        filter: brightness(1.05);
      }
      #btn:active {
        transform: scale(0.995);
      }
      #btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.45), transparent 70%);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .b2.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border: 1px solid rgba(255, 182, 213, 0.5);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 1.8rem 1.3rem 1.4rem;
        border-radius: 28px;
        background: radial-gradient(140% 140% at 50% 0%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 182, 213, 0.45);
        backdrop-filter: blur(20px) saturate(110%);
        -webkit-backdrop-filter: blur(20px) saturate(110%);
        box-shadow:
          0 30px 100px rgba(255, 61, 132, 0.35),
          0 0 70px rgba(255, 61, 132, 0.2),
          inset 0 0 60px rgba(255, 150, 200, 0.1);
        transform: scale(0.8) translateY(40px);
        transition: transform 1.4s cubic-bezier(0.25, 1.4, 0.3, 1), box-shadow 1.4s ease;
        overflow: hidden;
      }
      #card.show .box {
        transform: none;
        box-shadow:
          0 35px 120px rgba(255, 61, 132, 0.42),
          0 0 90px rgba(255, 61, 132, 0.24),
          inset 0 0 70px rgba(255, 150, 200, 0.14);
      }
      .box::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255, 217, 168, 0.14), transparent 55%);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .box > * {
        position: relative;
        z-index: 1;
      }
      .badge {
        display: inline-block;
        padding: 0.28rem 0.95rem;
        border-radius: 99px;
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 40px rgba(255, 217, 168, 0.65), 0 10px 40px rgba(255, 61, 132, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.45);
      }
      .big {
        font-size: 2.6rem;
        margin: 0.6rem 0 0;
        animation: beat 1.1s ease-in-out infinite;
        filter: drop-shadow(0 0 40px rgba(255, 61, 132, 0.7));
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.9rem, 9vw, 2.8rem);
        margin: 0.4rem 0 0.3rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #fff,
          #ff9ec8
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 6s linear infinite;
        text-shadow: 0 0 70px rgba(255, 61, 132, 0.35);
        letter-spacing: 0.02em;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.88rem;
        line-height: 1.7;
        min-height: 6.4em;
        margin: 0 0.3rem;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.65rem 0.55rem;
        border-radius: 16px;
        background: radial-gradient(120% 120% at 50% 0%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
        border: 1px solid rgba(255, 182, 213, 0.38);
        opacity: 0;
        transform: translateY(24px) scale(0.92);
        transition: all 0.9s cubic-bezier(0.25, 1.5, 0.3, 1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 15px 40px rgba(255, 61, 132, 0.2);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: clamp(1rem, 3.8vw, 1.25rem);
        color: var(--gold);
        line-height: 1.7;
        opacity: 0;
        transition: opacity 1.4s ease;
        text-shadow: 0 0 30px rgba(255, 217, 168, 0.4);
        margin: 0.8rem 0.4rem 0;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 1s;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 10px rgba(255, 61, 132, 0.7)) saturate(110%);
        will-change: transform, opacity;
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      * {
        cursor: none !important;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 28px;
        color: #ff3d84;
        text-shadow: 0 0 12px #ff3d84, 0 0 28px #ff6fae, 0 0 50px rgba(255, 61, 132, 0.35);
        opacity: 0;
        transition: opacity 0.4s ease;
        filter: drop-shadow(0 0 10px rgba(255, 61, 132, 0.65));
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.25s cubic-bezier(0.25, 0.8, 0.3, 1) forwards;
        text-shadow: 0 0 12px rgba(255, 61, 132, 0.95), 0 0 40px rgba(255, 61, 132, 0.6);
        filter: saturate(120%);
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
      <div class="glow g1"></div>
      <div class="glow g2"></div>

      <div id="stage">
        <div class="line l1" id="l1"></div>
        <div class="line l2" id="l2"></div>
        <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
        <button id="btn">Giải mã 💌</button>
      </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <script>
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "PHƯƠNG",
        name: "Phương",
        intro:
          "Nhân ngày 20/10, chúc Phương luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
        wishes: [
          ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
          ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
          ["✨", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
          ["🌹", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."],
        ],
        quote:
          "Cảm ơn bạn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
        sign: "— Một người luôn nghĩ đến bạn 🌹",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      for (let i = 0; i < 90; i++) {
        const s = document.createElement("div");
        s.className = "star" + (i % 7 === 0 ? " tiny" : i % 5 === 0 ? " med faint" : i % 3 === 0 ? " faint" : "");
        const delay = R(0, 5);
        const dur = R(3, 6);
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${delay}s;animation-duration:${dur}s;opacity:${R(0.3, 0.6)}`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;
      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        // chữ thật
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        // chữ gây nhiễu bay lung tung
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffd9a8",
          "#e0b3ff",
          "#fff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });

      // Nhạc nền
      const music = document.createElement("audio");
      music.src = "nhac.mp3";
      music.loop = true;
      music.setAttribute("preload", "auto");
      music.volume = 1.0;
      document.body.appendChild(music);

      function startMusic() {
        music.play().catch(() => {});
      }

      const startOnce = () => {
        startMusic();
      };
      addEventListener("pointerdown", startOnce, { once: true });
      addEventListener("keydown", startOnce, { once: true });
      addEventListener("touchstart", startOnce, { once: true, passive: true });
      addEventListener("click", startOnce, { once: true });

      setTimeout(startMusic, 800);

      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 8; i++)
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 14);
      }
      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        const dx = R(-90, 90);
        const dy = R(-90, 90);
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 12)}px;color:#ffc2dc;--bx:${dx}px;--by:${dy}px;text-shadow:0 0 20px rgba(255,61,132,0.8);`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(6, 12);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(18, 52)}px;animation-duration:${d}s;--dx:${R(-120, 120)}px;--rot:${R(-60, 60)}deg;opacity:${R(0.7, 0.9)};filter:drop-shadow(0 0 16px rgba(255,61,132,0.8)) saturate(115%);`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 60; i++) setTimeout(heart, i * 40);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) setTimeout(type, 40);
          else {
            document
              .querySelectorAll(".w")
              .forEach((w, k) =>
                setTimeout(() => w.classList.add("on"), k * 350),
              );
            setTimeout(() => $("quote").classList.add("on2"), 1700);
            setTimeout(() => $("sign").classList.add("on2"), 2500);
            setTimeout(() => ($("btns").style.opacity = 1), 3000);
          }
        }, 1200);
      }
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm();
        }
      });
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 40) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "💗", "💕"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(12, 22)}px;--tx:${R(-40, 40)}px;text-shadow:0 0 8px rgba(255,61,132,0.7),0 0 16px rgba(255,61,132,0.4);`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1250);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
        for (let i = 0; i < 8; i++)
          burst(e.clientX, e.clientY, rnd(HEARTS), 22);
        }
      });
    </script>
    </body>
</html>
